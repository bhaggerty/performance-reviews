services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: performance-reviews-dynamodb-local
    ports:
      - '8000:8000'
    command: ['-jar', 'DynamoDBLocal.jar', '-sharedDb', '-dbPath', '/home/dynamodblocal/data']
    volumes:
      - dynamodb-local-data:/home/dynamodblocal/data

volumes:
  dynamodb-local-data:
